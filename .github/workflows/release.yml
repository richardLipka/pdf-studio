name: Release (desktop & offline web bundle)

# Publishes a GitHub Release from a version tag on the desktop branch (git tag v2.0.0 && git push
# origin v2.0.0): Windows installer, portable executable and zip of the desktop edition, plus the
# offline web bundle. The live web app is deployed from master by deploy.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as a draft release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  web-bundle:
    name: Offline web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm test

      - name: Build and verify the web app
        run: |
          npm run build
          npm run verify:dist

      - name: Package the offline web bundle
        run: cd dist && zip -r ../pdf-studio-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: pdf-studio-web.zip
          if-no-files-found: error

  windows-desktop:
    name: Windows desktop edition
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Type-check the Electron shell
        run: npm run typecheck --prefix desktop

      - name: Build and package (installer, portable, zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist --prefix desktop

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [web-bundle, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lah release-assets
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          name: PDF Studio ${{ steps.assets.outputs.version }}
          body: |
            ## PDF Studio ${{ steps.assets.outputs.version }}

            ### Windows desktop edition
            - **Installer**: `PDF-Studio-Setup-${{ steps.assets.outputs.version }}.exe` (per-user install, Start menu and desktop shortcuts, "Open with" for PDF files)
            - **Portable**: `PDF-Studio-Portable-${{ steps.assets.outputs.version }}.exe` (no installation; settings are kept next to the executable)
            - **Zip**: `PDF-Studio-${{ steps.assets.outputs.version }}-win-x64.zip` (unpacked application folder)

            ### Web edition
            - **Live**: https://richardlipka.github.io/pdf-studio/
            - **Offline bundle**: `pdf-studio-web.zip` (unpack and serve from any static web server, e.g. an intranet)

            All PDF processing, rendering, signing and editing happens locally; nothing is uploaded.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
